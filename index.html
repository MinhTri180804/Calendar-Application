<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title></title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
      rel="stylesheet"
    />
    <link href="style/css/index.css" rel="stylesheet" />
  </head>
  <body>
    <div class="calendar__container">
      <div class="calendar__container-heading">
        <div class="icon-previous">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            fill="none"
            viewBox="0 0 24 24"
            stroke-width="1.5"
            stroke="currentColor"
            class="size-6"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M15.75 19.5 8.25 12l7.5-7.5"
            />
          </svg>
        </div>
        <div class="current-timestamp">Tháng 3 Năm 2025</div>
        <div class="icon-next">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            fill="none"
            viewBox="0 0 24 24"
            stroke-width="1.5"
            stroke="currentColor"
            class="size-6"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="m8.25 4.5 7.5 7.5-7.5 7.5"
            />
          </svg>
        </div>
      </div>
      <div class="calendar__container-days">
        <ul class="list__day">
          <li class="list__day-item">CN</li>
          <li class="list__day-item">T2</li>
          <li class="list__day-item">T3</li>
          <li class="list__day-item">T4</li>
          <li class="list__day-item">T5</li>
          <li class="list__day-item">T6</li>
          <li class="list__day-item">T7</li>
        </ul>
      </div>
      <div class="calendar__container-dates">
        <ul class="list__date">
          <li class="list__date-item">1</li>
          <li class="list__date-item">2</li>
          <li class="list__date-item">3</li>
          <li class="list__date-item">4</li>
          <li class="list__date-item">5</li>
          <li class="list__date-item">6</li>
          <li class="list__date-item">7</li>
          <li class="list__date-item">8</li>
          <li class="list__date-item">9</li>
          <li class="list__date-item">10</li>
          <li class="list__date-item">11</li>
          <li class="list__date-item">12</li>
          <li class="list__date-item">13</li>

      </div>
    </div>
  </body>
</html>
